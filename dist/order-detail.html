<link rel="stylesheet" href="glass-cards.css"><link rel="stylesheet" href="reference-redesign.css"><link rel="stylesheet" href="system-theme.css" data-fixed-theme="true"><link rel="stylesheet" href="merp-standard.css"><script>document.addEventListener("DOMContentLoaded",()=>{document.body.id="merp-embedded";document.body.classList.add("merp","merp-frame")})</script><link rel="stylesheet" href="ai-send-button.css"><link rel="stylesheet" href="grid-8.css?v=cards-unified-5px"><link rel="stylesheet" href="hover-tips.css?v=white-transparent"><script defer src="formal-check-icons.js?v=1"></script></head><body data-system-theme="one"><div class="main record-full" style="margin:0;width:100%"><div id="view" class="record-page"></div></div><dialog id="edit-plan"><h2>调整工单计划</h2><form onsubmit="saveRecordPlan(event)"><label>计划数量（件）</label><input name="qty" type="number" min="300" step="1" required><label>计划完工日期</label><input name="date" type="date" required><p id="plan-error" style="color:#d65b57"></p><div class="plan-actions"><button type="button" class="btn" onclick="this.closest('dialog').close()">取消</button><button class="btn primary">确认保存</button></div></form></dialog><script>const safe=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=n=>n==='check'?'✓':n==='arrow'?'←':'◇';const icons=()=>{};function recordReturnLabel(){return '业务概览'}function returnFromRecord(){parent.postMessage({type:'erp-close-record'},location.origin)}let recordTab='overview';let activeRecord={kind:'order',id:'MO-20261021-008',material:'A100 智能控制器',qty:500,done:300,progress:60,status:'生产中',date:'2026-10-26',start:'2026-10-22',plant:'1000 · 华东制造工厂',workshop:'电子装配一车间',owner:'李明 · 生产计划员',bom:'BOM-A100-V3 · 标准生产',route:'RT-02 · 标准装配',warehouse:'成品仓 FG01'};const page='record';
function editRecord(){const d=document.getElementById('edit-plan');d.querySelector('[name=qty]').value=activeRecord.qty;d.querySelector('[name=date]').value=activeRecord.date;d.showModal()}function saveRecordPlan(e){e.preventDefault();const d=document.getElementById('edit-plan'),qty=Number(d.querySelector('[name=qty]').value),date=d.querySelector('[name=date]').value;if(qty<activeRecord.done||date<activeRecord.start){document.getElementById('plan-error').textContent='数量不能小于已完工数量，完工日期不能早于开始日期。';return}activeRecord.qty=qty;activeRecord.date=date;activeRecord.progress=Math.round(activeRecord.done/qty*100);localStorage.setItem('erp-demo-production-plan',JSON.stringify(activeRecord));d.close();draw()}
function draw(){document.getElementById('view').innerHTML=recordMarkup(false)}
function recordMarkup(split){let r=activeRecord;return `${split?'<div class="embedded-shell">':''}<div class="recordbar"><div class="recordcrumb">${split?`<span class="embeddedbadge">${icon('doc')} 业务页面</span>`:`<button class="backlink" onclick="returnFromRecord()">${icon('arrow')} ${recordReturnLabel()}</button><span> / </span>`}<span>${r.kind==='order'?'生产管理 / 生产工单详情':'业务单据 / 详情'}</span></div>${split?`<button class="recordclose" aria-label="关闭详情" onclick="closeRecord()">${icon('close')}</button>`:''}</div><div class="record-body"><div class="record-hero"><div><div class="record-kicker">${r.kind==='order'?'生产工单':'业务单据'}</div><h1>${safe(r.id)}</h1><p>${safe(r.kind==='order'?r.material:r.title)}</p></div><span class="pill ${['草稿','待下达','待付款','待交付'].includes(r.status)?'amber':''}">${safe(r.status)}</span></div>${r.kind==='order'?orderFacts(r):businessFacts(r)}<div class="record-tabs" role="tablist" aria-label="单据详情分类">${(r.kind==='order'?[['overview','业务概览'],['process','工序进度'],['materials','物料清单'],['activity','操作记录']]:[['overview','基本信息'],['lines','单据明细'],['activity','审批记录']]).map(([key,label])=>`<button role="tab" aria-selected="${recordTab===key}" class="${recordTab===key?'selected':''}" onclick="changeRecordTab('${key}')">${label}</button>`).join('')}</div><div id="recordsections">${recordSections()}</div><div class="record-footer"><span>示例业务数据 · 当前组织：华东制造</span>${r.kind==='order'?`<button class="btn primary" onclick="editRecord()">调整计划</button>`:`<button class="btn primary" id="follow-record" onclick="toggleRecordFollow()">关注进度</button>`}</div></div>${split?'</div>':''}`}
function orderFacts(r){return `<div class="record-facts"><div><label>计划数量</label><strong>${r.qty.toLocaleString()} <small>件</small></strong></div><div><label>已完工数量</label><strong>${r.done.toLocaleString()} <small>件</small></strong></div><div><label>完成进度</label><strong>${r.progress}<small>%</small></strong><div class="progress"><span style="width:${r.progress}%"></span></div></div><div><label>计划完工</label><strong class="record-date">${safe(r.date)}</strong></div></div>`}
function businessFacts(r){return `<div class="record-facts business-facts"><div><label>单据金额</label><strong>${safe(r.money)}</strong></div><div><label>往来单位 / 申请人</label><strong class="record-date">${safe(r.person)}</strong></div><div><label>业务日期</label><strong class="record-date">${safe(r.date)}</strong></div></div>`}
function infoFields(items){return `<div class="record-fields">${items.map(([label,value])=>`<div><label>${label}</label><span>${safe(value)}</span></div>`).join('')}</div>`}
function recordSection(title,content,note=''){return `<section class="record-section"><div class="record-section-title"><h2>${title}</h2>${note?`<span>${note}</span>`:''}</div>${content}</section>`}
function orderProcess(r){return `<div class="record-process">${['备料','贴片加工','总装','测试入库'].map((x,i)=>{let stage=Math.min(3,Math.floor(r.progress/25));let status=r.progress===0?'未开始':i<stage?'已完成':i===stage?'进行中':'待开始';return `<div class="record-step ${status==='已完成'?'complete':status==='进行中'?'current':''}"><i>${status==='已完成'?icon('check'):i+1}</i><b>${x}</b><span>${status}</span></div>`}).join('')}</div><div class="validation">${icon(r.progress?'check':'clock')}${r.progress?'铝制外壳存在缺口，请点击物料异常查看原因与处理方案。':'工单下达后，持续跟踪各工序执行进度。'}</div>`}
function orderMaterials(r){const issued=Math.max(0,r.qty-materialShortage());return `<div class="record-table-scroll"><table><thead><tr><th>物料编码 / 名称</th><th>需求数量</th><th>已领用</th><th>齐套状态</th></tr></thead><tbody><tr><td>PCB-01 · 主控板</td><td>${r.qty} 块</td><td>${r.qty} 块</td><td><span class="pill">充足</span></td></tr><tr class="material-exception-row"><td>HSG-01 · 铝制外壳</td><td>${r.qty} 套</td><td>${issued} 套</td><td><button class="exception-trigger" onclick="openMaterialAnalysis()" aria-label="分析铝制外壳异常">! 异常 · AI分析 ↗</button></td></tr></tbody></table></div>`}
function recordSections(){let r=activeRecord;if(r.kind==='order'){if(recordTab==='process')return recordSection('工序执行进度',orderProcess(r),'标准装配路线');if(recordTab==='materials')return recordSection('组件与物料清单',orderMaterials(r),'1 项物料异常待处理');if(recordTab==='activity')return recordSection('操作记录',recordActivity(r));return recordSection('基本信息',infoFields([['生产工厂',r.plant],['生产车间',r.workshop],['生产负责人',r.owner],['工单类型','标准生产'],['计划开始',r.start],['计划完成',r.date],['入库仓库',r.warehouse],['优先级','正常']]))+recordSection('生产方案',infoFields([['物料清单版本',r.bom],['工艺路线',r.route],['成本中心','CC-1001 · 电子装配'],['批次规则','按工单自动生成']]))+recordSection('工序进度',orderProcess(r))+recordSection('物料概况',orderMaterials(r))}if(recordTab==='activity')return recordSection('审批与处理记录',recordActivity(r));if(recordTab==='lines')return recordSection('单据明细',businessLines(r));return recordSection('基本信息',infoFields([['业务单号',r.id],['业务类型',r.title.split(' ')[0]],['往来单位 / 申请人',r.person],['所属组织','华东制造'],['业务日期',r.date],['处理状态',r.status],['经办人','李明'],['币种','人民币']]))+recordSection('单据明细',businessLines(r))+recordSection('审批进度',recordActivity(r))}
function businessLines(r){return `<div class="record-table-scroll"><table><thead><tr><th>项目</th><th>说明</th><th>金额</th></tr></thead><tbody><tr><td>${/报销/.test(r.title)?'差旅费用':'业务明细'}</td><td>${/采购/.test(r.title)?'主控板 · 按采购合同交付':'按业务单据记录归集'}</td><td>${safe(r.money)}</td></tr></tbody></table></div>`}
function recordActivity(r){return `<div class="record-activity"><div><i></i><span><b>${r.kind==='order'?(r.progress?'更新工序进度':'保存生产工单草稿'):'单据进入业务处理流程'}</b><small>2026-10-21 09:42 · 李明</small></span></div><div><i></i><span><b>基础信息与组织权限校验通过</b><small>2026-10-21 09:40 · 系统</small></span></div></div>`}
function changeRecordTab(key){recordTab=key;let root=document.querySelector('#recordpane')||document.querySelector('#view');root.querySelectorAll('.record-tabs button').forEach(b=>{let selected=b.getAttribute('onclick').includes("'"+key+"'");b.classList.toggle('selected',selected);b.setAttribute('aria-selected',String(selected))});root.querySelector('#recordsections').innerHTML=recordSections();icons()}

function materialShortage(){return Math.min(40,activeRecord.qty)}
function openMaterialAnalysis(){let overlay=document.getElementById('material-analysis');if(!overlay){overlay=document.createElement('div');overlay.id='material-analysis';overlay.className='material-analysis';document.body.append(overlay)}const need=activeRecord.qty,short=materialShortage(),issued=need-short,percent=(short/need*100).toFixed(1),transferCost=short*5,urgentCost=short*12;
const plans=[{title:'方案一：跨仓调拨补齐',tag:'推荐',desc:'从华南成品配套仓调拨 '+short+' 套铝制外壳，预计 4 小时到位，复核后继续总装。',calc:'调拨费用：'+short+' × ¥5 = ¥'+transferCost+'；预计无需调整原完工日。',condition:'适用条件：调出仓可用库存 80 套，调拨及批次审核通过。'},{title:'方案二：加急采购补料',tag:'采购协同',desc:'向现有供应商加急补充 '+short+' 套，预计 1 天到货；到货检验合格后完成剩余生产。',calc:'加急增量费用：'+short+' × ¥12 = ¥'+urgentCost+'；预计总装后移 1 天。',condition:'适用条件：供应商确认库存、交期，并完成采购审批。'},{title:'方案三：分批生产并调整计划',tag:'计划调整',desc:'先完成已齐套的 '+issued+' 件，剩余 '+short+' 件待常规补料后继续生产，预计 2 天后补齐。',calc:'加急物流增量费用：¥0；受影响数量 '+short+' 件（'+percent+'%），尾批预计后移 2 天。',condition:'适用条件：客户接受分批交付，计划员批准排程调整。'}];let chosen=-1;
overlay.innerHTML='<section class="material-analysis-panel" role="dialog" aria-modal="true" aria-labelledby="material-analysis-title"><header class="material-analysis-head"><img src="assets/tech-panda-perched.png" alt="智能熊猫"><div><h2 id="material-analysis-title">AI 异常分析</h2><small>生产工单 '+activeRecord.id+'</small></div><button id="close-material-analysis" aria-label="关闭异常分析">×</button></header><div class="material-analysis-content"><section class="analysis-block"><h3>为什么异常？</h3><p><b>HSG-01 · 铝制外壳领料不足。</b>工单要求 '+need+' 套，已领用 '+issued+' 套；其余 '+short+' 套因当前仓库库存被其他工单预留，尚未完成领料。</p><div class="calculation">数量缺口：'+need+' − '+issued+' = '+short+' 套<br>缺口比例：'+short+' ÷ '+need+' × 100% = '+percent+'%</div><p>影响：剩余 '+short+' 件无法完成总装及测试入库。主控板齐套，其他物料无需调整。</p></section><section class="analysis-block"><h3>三个推荐可选方案</h3><p>按到料时间、增量费用与交付影响比较，优先推荐跨仓调拨。</p><div role="radiogroup" aria-label="选择异常处理方案">'+plans.map((p,i)=>'<button class="material-choice" role="radio" aria-checked="false" data-plan="'+i+'"><strong>○ '+p.title+'<em>'+p.tag+'</em></strong><small>'+p.desc+'</small><small>'+p.calc+'</small><small>'+p.condition+'</small></button>').join('')+'</div><button id="confirm-material-plan" class="material-confirm" disabled>选择方案后确认</button><div id="material-selected" class="material-selected" role="status"></div></section></div><footer class="material-analysis-note">交互演示 · 按示例库存、运费及到料时间规则测算。方案需你确认，并经业务审批后执行。</footer></section>';
overlay.hidden=false;document.body.style.overflow='hidden';const close=()=>{overlay.hidden=true;document.body.style.overflow=''};overlay.querySelector('#close-material-analysis').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};overlay.onkeydown=e=>{if(e.key==='Escape')close()};const confirm=overlay.querySelector('#confirm-material-plan');overlay.querySelectorAll('[data-plan]').forEach(button=>button.onclick=()=>{chosen=Number(button.dataset.plan);overlay.querySelectorAll('[data-plan]').forEach(b=>b.setAttribute('aria-checked',String(b===button)));confirm.disabled=false;confirm.textContent='确认选择方案'+['一','二','三'][chosen];overlay.querySelector('#material-selected').textContent=''});confirm.onclick=()=>{if(chosen<0)return;localStorage.setItem('erp-production-material-plan',JSON.stringify({order:activeRecord.id,material:'HSG-01',plan:plans[chosen],shortage:short,selectedAt:new Date().toISOString()}));overlay.querySelector('#material-selected').textContent='✓ 已记录：'+plans[chosen].title+'。待业务人员审批，尚未执行调拨、采购或计划调整。';confirm.textContent='已确认选择'};overlay.querySelector('#close-material-analysis').focus()}
