const catalog=[{"id":"procurement","name":"发票到付款","icon":"▧","type":"analysis","tag":"应付管理","desc":"协助核对发票、订单与验收资料，跟进付款申请、审批及支付进度。"},{"id":"inventory","name":"月末关账","icon":"◷","type":"analysis","tag":"关账协同","desc":"整理关账清单，跟进对账、调整与复核事项，协同完成月末关账。"},{"id":"reports","name":"应收催款","icon":"⇄","type":"analysis","tag":"应收管理","desc":"梳理应收账款与到期情况，整理催款计划并跟进回款进度。"},{"id":"supplier","name":"费用报销","icon":"▤","type":"analysis","tag":"费用管理","desc":"核对报销单据、费用归属和审批信息，辅助整理待补充与待确认事项。"},{"id":"contract","name":"固定资产核对","icon":"▦","type":"analysis","tag":"资产核算","desc":"核对固定资产台账、实物与账务记录，梳理折旧和资产变动差异。"},{"id":"logistics","name":"总账异常处理","icon":"◇","type":"analysis","tag":"总账管理","desc":"识别总账异常与账务差异，整理核查依据、处理建议及复核事项。"}];let customSkills=[];try{customSkills=JSON.parse(localStorage.getItem('erp-custom-skills'))||[]}catch(e){}catalog.push(...customSkills);let installed;try{installed=JSON.parse(localStorage.getItem('erp-installed-skills'))}catch(e){}if(!Array.isArray(installed))installed=['procurement','inventory','reports'];let category='all';function renderSkills(){let q=document.getElementById('search').value.trim().toLowerCase();let list=catalog.filter(s=>(category==='all'||category==='installed'&&installed.includes(s.id)||category===s.type)&&(s.name+s.desc+s.tag).toLowerCase().includes(q));document.getElementById('count').textContent=list.length+' 个技能 · 已添加 '+installed.length+' 个';document.getElementById('cards').innerHTML=list.map(s=>'<article class="card"><div class="cardtop"><div class="icon">'+s.icon+'</div><span class="tag">'+s.tag+'</span></div><h2>'+safeText(s.name)+'</h2><p>'+safeText(s.desc)+'</p><div class="bottom"><small>业务模板 · v1.0</small><button class="install '+(installed.includes(s.id)?'installed':'')+'" data-id="'+s.id+'">'+(installed.includes(s.id)?'✓ 已添加 · 移除':'＋ 添加技能')+'</button></div></article>').join('')||'<div class="empty">暂无匹配技能，试试其他关键词。</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>toggle(b.dataset.id))}function toggle(id){let had=installed.i
