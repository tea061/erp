p:6px;margin:15px 0 0}.tags span{background:#f2f5f9;padding:4px 6px;font-size:12px;color:#5e7190;border-radius:4px}.job p{font-size:13px;line-height:1.9;flex:1}.job small{font-size:12px;color:#8794a6}.last{font-size:12px;color:#98a3b4;border-top:1px solid #edf0f5;margin-top:18px;padding-top:14px}.actions{display:flex;justify-content:space-between;gap:5px;margin-top:14px}.actions button{font-size:12px;border:0;background:#f5f7fa;border-radius:5px;padding:7px;color:#607591}.enter{border:0;background:#edf5ff;color:#0067D1;border-radius:6px;padding:9px;margin-top:12px;font-size:12px}dialog{border:1px solid #dfe6f2;border-radius:16px;width:580px;max-width:95vw;max-height:90vh;padding:27px;overflow:auto}dialog::backdrop{background:#283b5b66}dialog header{display:flex;justify-content:space-between}dialog h2{margin:0;font-size:21px}dialog header p{font-size:12px;color:#8995a8}dialog header button{border:0;background:none;font-size:24px;height:30px}label{display:block;font-size:13px;margin:17px 0 8px}form input,form select,form textarea{width:100%;padding:10px;border:1px solid #dfe6ef;border-radius:7px;background:#fff}textarea{min-height:85px}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}.form-actions button{padding:10px 20px;border:1px solid #dfe6ef;border-radius:7px}.empty{padding:40px;color:#909baa;grid-column:1/-1}@media(max-width:1000px){#tasks{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){main{padding:20px}#tasks{grid-template-columns:1fr}.filters{flex-wrap:wrap}.filters input{width:100%}.heading{align-items:flex-start;gap:12px}}</style><script src="ops-config.js"></script><link rel="stylesheet" href="system-theme.css" data-fixed-theme="true"><style>html,body{min-height:100vh!important;background:#F5F6F8!important}body{min-height:100dvh!important}main{min-height:100vh;background:transparent!important}.job{background:#fff!important}</style><link rel="stylesheet" href="automation-cards.css?v=height-400"><link rel="stylesheet" href="merp-standard.css?v=channel-tab-offset"><script>document.addEventListener("DOMContentLoaded",()=>{document.body.id="merp-embedded";document.body.classList.add("merp","merp-frame")})</script><link rel="stylesheet" href="ai-send-button.css"><link rel="stylesheet" href="grid-8.css?v=cards-unified-5px"><link rel="stylesheet" href="hover-tips.css?v=white-transparent"><script defer src="formal-check-icons.js?v=1"></script></head><body data-system-theme="one"><main><div class="heading"><div><h1>自动化任务</h1><p>按时间或业务事件触发，关联智能体与技能自动处理业务。</p></div></div><div class="automation-tabbar"><div class="tabs" role="tablist" aria-label="自动化任务类型"><button role="tab" aria-selected="true" class="active" data-type="scheduled" onclick="switchType('scheduled')">◷ 定时任务</button><button role="tab" aria-selected="false" data-type="event" onclick="switchType('event')">⇄ 事件任务</button></div><button id="new-task" onclick="edit()">＋ 新建定时任务</button></div><div class="info"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l4 2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>支持每日、每周与单次执行 · 时间均为北京时间（UTC+8）</span></div><div class="filters"><div class="merp-task-status" role="group" aria-label="任务状态筛选"><button class="active" data-filter="all">全部任务</button><button data-filter="enabled">已启用</button><button data-filter="paused">已暂停</button></div><input id="search" placeholder="搜索任务、智能体或技能" aria-label="搜索自动化任务"></div><div id="tasks"></div></main><dialog id="editor"></dialog><script src="automation-v2.js?v=compact-trigger-time"></script><link rel="stylesheet" href="workspace-surface.css"><script src="personalization.js"></script><script src="global-ai-orb.js?v=erp-one-name"></script><script src="unified-close.js" defer></script><script src="hover-tips.js?v=white-transparent"></script></body></html>
