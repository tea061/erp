const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let w,h,ratio,angleY=-.25,angleX=-.12,zoom=1,moving=true,selected=null,down=null,projected=[];
const nodes=[{id:'SO-1021',name:'购置申请',x:-370,y:-70,z:30},{id:'SO-1022',name:'购置申请明细',x:-260,y:-190,z:-90},{id:'MRP-008',name:'资产购置计划',x:-180,y:10,z:110},{id:'INV-026',name:'预算可用额度',x:-260,y:190,z:-70},{id:'BOM-003',name:'资产配置清单',x:-60,y:-190,z:40},{id:'PLAN-012',name:'购置执行计划',x:0,y:0,z:-40},{id:'WO-018',name:'购置管理模块：基建场景',x:190,y:-15,z:100,error:true},{id:'ROUTE-006',name:'审批流程',x:110,y:180,z:-110},{id:'MAT-021',name:'采购申请',x:350,y:-170,z:-50},{id:'DIS-015',name:'采购订单',x:380,y:60,z:90},{id:'IN-028',name:'资产验收入库',x:450,y:210,z:-80},{id:'CAP-005',name:'年度投资计划',x:55,y:-285,z:-110}];const edges=[[0,1],[0,2],[1,2],[3,2],[2,5],[4,5],[11,5],[5,6],[7,6],[6,8],[6,9],[9,10]];const stars=Array.from({length:90},(_,i)=>({x:((i*7919)%1000)/1000,y:((i*3571)%1000)/1000,a:.15+(i%5)*.07}));function resize(){ratio=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*ratio;canvas.height=h*ratio;ctx.setTransform(ratio,0,0,ratio,0,0)}addEventListener('resize',resize);resize();function project(n,t){const x=n.x*Math.cos(angleY)+n.z*Math.sin(angleY),z=-n.x*Math.sin(angleY)+n.z*Math.cos(angleY),y=n.y*Math.cos(angleX)-z*Math.sin(angleX),zz=n.y*Math.sin(angleX)+z*Math.cos(angleX);const scale=750/(850+zz)*zoom*Math.min(w/1200,h/760);return {n,x:w*.49+x*scale,y:h*.53+(y+(moving?Math.sin(t*.0008+nodes.indexOf(n)) *5:0))*scale,r:(n.error?29:24)*scale,scale,z:zz}}function draw(t){ctx.clearRect(0,0,w,h);const bg=ctx.createRadialGradient(w*.48,h*.48,0,w*.5,h*.5,w*.65);bg.addColorStop(0,'#123456');bg.addColorStop(1,'#061329');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);stars.forEach(s=>{ctx.fillStyle='rgba(106,174,245,'+s.a+')';ctx.fillRect(s.x*w,s.y*h,1,1)});ctx.strokeStyle='#2e5a8225';ctx.lineWidth=1;for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(w*.5+i*95,h*.95);ctx.lineTo(w*.5+i*25,h*.58);ctx.stroke()}for(let j=0;j<6;j++){const y=h*.6+j*j*11;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}projected=nodes.map(n=>project(n,t));edges.forEach(([a,b])=>{const p=projected[a],q=projected[b];ctx.strokeStyle=q.n.error?'#dc718169':'#4d9de960';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();const f=moving?(t*.00013+a*.17)%1:.5;ctx.fillStyle=q.n.error?'#ff8c9b':'#8dd3ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=9;ctx.beginPath();ctx.arc(p.x+(q.x-p.x)*f,p.y+(q.y-p.y)*f,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;const ang=Math.atan2(q.y-p.y,q.x-p.x),mx=p.x+(q.x-p.x)*.72,my=p.y+(q.y-p.y)*.72;ctx.beginPath();ctx.moveTo(mx-6*Math.cos(ang-.45),my-6*Math.sin(ang-.45));ctx.lineTo(mx,my);ctx.lineTo(mx-6*Math.cos(ang+.45),my-6*Math.sin(ang+.45));ctx.stroke()});[...projected].sort((a,b)=>b.z-a.z).forEach(p=>{const r=Math.max(10,p.r),red=p.n.error;ctx.shadowColor=red?'#ff435f':'#268eff';ctx.shadowBlur=red?30:18;const g=ctx.createRadialGradient(p.x-r*.35,p.y-r*.4,1,p.x,p.y,r);g.addColorStop(0,red?'#ffced2':'#d2f1ff');g.addColorStop(.25,red?'#ff7588':'#70c9ff');g.addColorStop(.68,red?'#d82c55':'#226ed1');g.addColorStop(1,red?'#681d45':'#102e73');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=red?'#ff9fa9aa':'#9ddaff99';ctx.lineWidth=1;ctx.stroke();ctx.strokeStyle=red?'#ff607f55':'#4da6f93b';ctx.beginPath();ctx.ellipse(p.x,p.y,r*1.45,r*.48,-.25,0,Math.PI*2);ctx.stroke();if(red){ctx.fillStyle='#fff1f3';ctx.font='bold '+Math.max(14,r*.8)+'px sans-serif';ctx.textAlign='center';ctx.fillText('!',p.x,p.y+r*.28)}ctx.textAlign='center';ctx.fillStyle=red?'#ffb1bd':'#a7cff9';ctx.font='11px Microsoft YaHei';ctx.fillText(p.n.name,p.x,p.y+r+23);ctx.fillStyle=red?'#c76a83':'#5e86b5';ctx.font='9px sans-serif';ctx.fillText(p.n.id,p.x,p.y+r+39);if(selected===p.n){ctx.strokeStyle=red?'#ff9aab':'#9dd6ff';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(p.x,p.y,r+7,0,Math.PI*2);ctx.stroke()}});requestAnimationFrame(draw)}requestAnimationFrame(draw);function hit(x,y){return [...projected].sort((a,b)=>a.z-b.z).find(p=>Math.hypot(p.x-x,p.y-y)<Math.max(15,p.r)+5)}canvas.onpointerdown=e=>{const p=hit(e.clientX,e.clientY);down={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,node:p?.n,scale:p?.scale||1};canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing'};canvas.onpointermove=e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(down.node){down.node.x+=dx/down.scale*Math.cos(angleY);down.node.z+=dx/down.scale*Math.sin(angleY);down.node.y+=dy/down.scale}else{angleY+=dx*.006;angleX=Math.max(-1,Math.min(1,angleX+dy*.004))}down.x=e.clientX;down.y=e.clientY};canvas.onpointerup=e=>{if(down&&Math.hypot(e.clientX-down.startX,e.clientY-down.startY)<6&&down.node){selected=down.node;showDetails(selected)}down=null;canvas.style.cursor='grab'};canvas.onpointercancel=()=>{down=null;canvas.style.cursor='grab'};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2.1,zoom-e.deltaY*.001))};function showDetails(n){const d=document.getElementById('details');d.hidden=false;d.innerHTML='<button class="close" aria-label="关闭单据详情" onclick="document.getElementById(\'details\').hidden=true">×</button><span class="tag '+(n.error?'':'normal')+'">'+(n.error?'● 异常单据':'● 正常单据')+'</span><h2>'+n.name+'</h2><div class="kv"><span>单据编号</span><strong>'+n.id+'</strong></div><div class="kv"><span>关联智能体</span><strong>购置执行计划员智能体</strong></div><div class="kv"><span>当前状态</span><strong>'+(n.error?'审批驳回 · 待处理':'已关联 · 校验正常')+'</strong></div>'+(n.error?'<div class="alert"><b>异常信息</b><br>购置申请与预算、资产分类信息不一致，审批未通过，后续采购和验收入库流程暂缓。</div><p class="desc">上游来源：购置执行计划 PLAN-012<br>下游影响：采购申请 MAT-021、采购订单 DIS-015</p><p class="tip">建议核对预算额度、资产类别与购置申请信息，完善资料后重新提交审批。</p>':'<p class="desc">该单据关联关系正常，可沿连接线检查其上游来源与下游流向。</p>')+'<button class="action" onclick="goBack()">返回AI助手查看方案</button>'}document.getElementById('reset').onclick=()=>{angleY=-.25;angleX=-.12;zoom=1;document.getElementById('details').hidden=true;selected=null};document.getElementById('motion').onclick=e=>{moving=!moving;e.target.textContent=moving?'暂停悬浮':'恢复悬浮'};function goBack(){if(parent!==window)parent.postMessage({type:'erp-close-relations'},location.origin);else location.href='./'}addEventListener('keydown',e=>{if(e.key==='Escape')goBack()});
